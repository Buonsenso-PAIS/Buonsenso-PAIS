<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAIS — BuonsensoClinic</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-8JEGDN6N7Y"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-8JEGDN6N7Y');

  // Track key events
  function trackEvent(name, params){
    if(typeof gtag !== 'undefined') gtag('event', name, params || {});
  }
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap');
:root{
  --bg:#f5f2ee;--surface:#fff;--surface2:#faf8f5;--border:#e2ddd8;
  --text:#2a2520;--text-light:#7a6e66;--accent:#4a7a9b;--accent-soft:#e6f0f6;
  --accent2:#7a5f4e;--danger:#c0574a;--success:#3d7a5e;--success-soft:#e8f5ee;
  --warm:#d4943a;--crypto:#e8870f;--revolut:#191C33;
  --changed:#e8a84a;--changed-soft:#fff8e8;
  --shadow:0 2px 14px rgba(42,37,32,0.09);--radius:13px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6;}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(42,37,32,0.07);gap:10px;flex-wrap:wrap;}
.logo-wrap{display:flex;flex-direction:column;}
.logo-main{font-family:'Lora',serif;font-size:1rem;color:var(--accent);font-weight:600;letter-spacing:-0.01em;line-height:1.2;}
.logo-sub{font-size:0.7rem;color:var(--text-light);font-weight:400;letter-spacing:0.03em;}
.lang-toggle{display:flex;gap:3px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px;}
.lang-btn{border:none;background:none;padding:4px 9px;border-radius:5px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:0.78rem;font-weight:500;color:var(--text-light);transition:all 0.2s;}
.lang-btn.active{background:var(--accent);color:white;}
.progress-wrap{background:var(--surface);padding:10px 20px;border-bottom:1px solid var(--border);}
.progress-info{display:flex;justify-content:space-between;font-size:0.76rem;color:var(--text-light);margin-bottom:4px;}
.progress-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.5s ease;}
main{max-width:700px;margin:0 auto;padding:24px 16px 80px;}
.screen{display:none;animation:fadeIn 0.35s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ── WELCOME ── */
.welcome-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px 28px;text-align:center;box-shadow:var(--shadow);}
.clinic-badge{display:inline-flex;align-items:center;gap:7px;background:var(--accent-soft);border:1px solid #b8d4e6;border-radius:99px;padding:5px 14px;font-size:0.78rem;color:var(--accent);font-weight:500;margin-bottom:14px;}
.welcome-card h1{font-family:'Lora',serif;font-size:1.45rem;color:var(--text);margin-bottom:7px;line-height:1.3;}
.welcome-card h2{font-family:'Lora',serif;font-size:0.95rem;color:var(--accent2);font-weight:400;font-style:italic;margin-bottom:13px;}
.welcome-card p{color:var(--text-light);margin-bottom:7px;font-size:0.89rem;}
.notice{background:var(--accent-soft);border:1px solid #b8d4e6;border-radius:8px;padding:11px 15px;font-size:0.82rem;color:#2d5f7a;margin:13px 0;text-align:left;line-height:1.6;}
.author-notice{background:#faf5ff;border:1px solid #d4b8e8;border-radius:8px;padding:11px 15px;font-size:0.82rem;color:#5a3a7a;margin:10px 0;text-align:left;line-height:1.6;}
.donation-notice{background:var(--warm-soft,#fff8e8);border:1px solid #f0d9a0;border-radius:8px;padding:10px 15px;font-size:0.81rem;color:#7a5010;margin:10px 0;text-align:left;line-height:1.6;}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
.mode-card{background:var(--surface2);border:2px solid var(--border);border-radius:11px;padding:20px 16px;cursor:pointer;transition:all 0.2s;text-align:center;}
.mode-card:hover{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-2px);box-shadow:var(--shadow);}
.mode-card .mode-icon{font-size:2rem;margin-bottom:8px;}
.mode-card h3{font-family:'Lora',serif;font-size:1rem;color:var(--text);margin-bottom:5px;}
.mode-card p{font-size:0.8rem;color:var(--text-light);line-height:1.45;}
@media(max-width:480px){.mode-grid{grid-template-columns:1fr;}}

/* ── FOLLOWUP SCREEN ── */
.followup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow);}
.followup-card h2{font-family:'Lora',serif;font-size:1.15rem;color:var(--text);margin-bottom:8px;}
.followup-card p{font-size:0.87rem;color:var(--text-light);margin-bottom:16px;line-height:1.6;}
.code-input-wrap{display:flex;gap:10px;margin-bottom:14px;}
.code-input{font-family:monospace;font-size:1.1rem;letter-spacing:0.1em;text-transform:uppercase;text-align:center;padding:12px 16px;border:2px solid var(--border);border-radius:9px;background:var(--surface2);width:100%;outline:none;transition:border-color 0.2s;}
.code-input:focus{border-color:var(--accent);background:white;}
.code-error{color:var(--danger);font-size:0.83rem;margin-top:6px;display:none;}
.or-divider{display:flex;align-items:center;gap:12px;margin:16px 0;font-size:0.8rem;color:var(--text-light);}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.file-import-area{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--surface2);}
.file-import-area:hover{border-color:var(--accent);background:var(--accent-soft);}

/* ── PATIENT CODE DISPLAY ── */
.code-display{background:linear-gradient(135deg,#f0f9ff,#e6f0f6);border:2px solid var(--accent);border-radius:11px;padding:22px;text-align:center;margin-bottom:14px;}
.code-display p{font-size:0.83rem;color:var(--text-light);margin-bottom:8px;}
.code-value{font-family:monospace;font-size:1.8rem;font-weight:700;color:var(--accent);letter-spacing:0.18em;background:white;border:2px solid var(--accent);border-radius:8px;padding:12px 24px;display:inline-block;margin-bottom:10px;cursor:pointer;transition:all 0.2s;}
.code-value:hover{background:var(--accent-soft);}
.code-display small{font-size:0.76rem;color:var(--text-light);line-height:1.5;display:block;}
.code-copy-row{display:flex;gap:8px;justify-content:center;margin-top:10px;}
.code-copied{color:var(--success);font-size:0.82rem;font-weight:500;display:none;margin-top:4px;}

/* ── FOLLOWUP BADGE ── */
.followup-badge{display:inline-flex;align-items:center;gap:6px;background:var(--changed-soft);border:1px solid var(--changed);border-radius:99px;padding:4px 12px;font-size:0.76rem;color:#7a5010;font-weight:500;margin-bottom:10px;}
.changed-indicator{background:var(--changed-soft);border:1px solid var(--changed);border-radius:6px;padding:3px 8px;font-size:0.72rem;color:#7a5010;font-weight:500;margin-left:6px;white-space:nowrap;}
.prev-value{font-size:0.78rem;color:var(--text-light);margin-top:4px;padding:4px 8px;background:var(--surface2);border-left:3px solid var(--border);border-radius:0 4px 4px 0;font-style:italic;}

/* ── Q CARD ── */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:23px 23px 19px;box-shadow:var(--shadow);margin-bottom:13px;}
.q-section{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.09em;color:var(--accent);font-weight:500;margin-bottom:6px;}
.q-text{font-family:'Lora',serif;font-size:1.1rem;color:var(--text);margin-bottom:5px;line-height:1.4;}
.q-hint{font-size:0.8rem;color:var(--text-light);margin-bottom:14px;font-style:italic;}
textarea,input[type="text"],input[type="email"]{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--text);background:var(--surface2);resize:vertical;transition:border-color 0.2s;outline:none;}
textarea:focus,input:focus{border-color:var(--accent);background:white;}
textarea{min-height:90px;}
.voice-wrap{display:flex;align-items:center;gap:10px;margin-top:9px;}
.voice-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1.5px solid var(--accent);border-radius:8px;background:none;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:0.8rem;cursor:pointer;transition:all 0.2s;font-weight:500;}
.voice-btn:hover{background:var(--accent-soft);}
.voice-btn.recording{background:#ffeeed;border-color:var(--danger);color:var(--danger);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.voice-status{font-size:0.76rem;color:var(--text-light);font-style:italic;}
.options-grid{display:flex;flex-direction:column;gap:6px;}
.option-label{display:flex;align-items:flex-start;gap:11px;padding:10px 13px;border:1.5px solid var(--border);border-radius:8px;cursor:pointer;background:var(--surface2);transition:all 0.15s;font-size:0.89rem;line-height:1.45;}
.option-label:hover{border-color:var(--accent);background:var(--accent-soft);}
.option-dot{width:17px;height:17px;border:2px solid var(--border);flex-shrink:0;background:white;display:flex;align-items:center;justify-content:center;margin-top:2px;border-radius:4px;transition:all 0.15s;}
.option-label.selected{border-color:var(--accent);background:var(--accent-soft);}
.option-label.selected .option-dot{background:var(--accent);border-color:var(--accent);}
.option-label.selected .option-dot::after{content:'✓';color:white;font-size:0.67rem;font-weight:700;}
.adl-note{font-size:0.78rem;color:var(--text-light);margin-bottom:8px;font-style:italic;}
input[type="range"]{width:100%;accent-color:var(--accent);cursor:pointer;}
.slider-value{text-align:center;font-size:1.3rem;font-weight:500;color:var(--accent);margin-top:3px;font-family:'Lora',serif;}
.slider-labels{display:flex;justify-content:space-between;font-size:0.73rem;color:var(--text-light);margin-top:3px;}
.bell-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;margin-top:9px;}
.bell-card strong{color:var(--accent);font-size:0.71rem;display:block;margin-bottom:7px;text-transform:uppercase;letter-spacing:0.06em;}
.bell-row{display:flex;gap:9px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px;padding:7px 5px;align-items:flex-start;transition:background 0.1s;}
.bell-row:last-child{border-bottom:none;}
.bell-row:hover{background:var(--accent-soft);}
.bell-score{font-weight:700;color:var(--accent2);min-width:27px;font-size:0.87rem;}
.bell-desc{color:var(--text);font-size:0.81rem;line-height:1.44;}
.bell-row.bell-selected{background:var(--accent-soft);border:1.5px solid var(--accent);}
.file-upload-area{border:2px dashed var(--border);border-radius:10px;padding:17px;text-align:center;cursor:pointer;transition:all 0.2s;background:var(--surface2);}
.file-upload-area:hover,.file-upload-area.dragover{border-color:var(--accent);background:var(--accent-soft);}
.file-list{margin-top:8px;display:flex;flex-direction:column;gap:5px;}
.file-item{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:0.8rem;}
.file-item .rm{margin-left:auto;cursor:pointer;color:var(--text-light);border:none;background:none;}

/* ── BUTTONS ── */
.btn{padding:11px 20px;border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:500;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:7px;}
.btn-primary{background:var(--accent);color:white;}
.btn-primary:hover{background:#3d6b87;transform:translateY(-1px);box-shadow:0 4px 12px rgba(74,122,155,0.3);}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-secondary:hover{background:var(--surface2);}
.btn-pdf{background:#c0392b;color:white;}
.btn-pdf:hover{background:#a93226;}
.btn-warm{background:var(--warm);color:white;}
.btn-revolut{background:var(--revolut);color:white;}
.btn-crypto{background:var(--crypto);color:white;}
.btn-success-col{background:var(--success);color:white;}
.btn-substack{background:#FF6719;color:white;}
.btn-substack:hover{background:#e05510;}
.btn-export{background:#6c5ce7;color:white;}
.btn-export:hover{background:#5a4bd1;}
.nav-buttons{display:flex;justify-content:space-between;gap:11px;margin-top:15px;}
.nav-buttons .btn{flex:1;justify-content:center;}

/* ── SUMMARY ── */
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:23px;box-shadow:var(--shadow);margin-bottom:13px;}
.summary-card h3{font-family:'Lora',serif;font-size:0.96rem;color:var(--accent2);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.summary-text-area{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:14px;font-family:'DM Sans',sans-serif;font-size:0.85rem;line-height:1.75;color:var(--text);width:100%;min-height:260px;white-space:pre-wrap;resize:vertical;outline:none;}
.ai-badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,#f0e8ff,#e8f1ff);border:1px solid #c5b8e8;border-radius:20px;padding:3px 10px;font-size:0.72rem;color:#6854a4;font-weight:500;margin-bottom:10px;}
.copy-success{color:var(--success);font-size:0.82rem;font-weight:500;display:none;}
.pdf-generating{color:var(--accent);font-size:0.82rem;display:none;align-items:center;gap:6px;}

/* ── SUBSTACK ── */
.substack-card{background:linear-gradient(135deg,#fff8f3,#fff3ea);border:1.5px solid #ffd4b0;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:13px;text-align:center;}
.substack-card h3{font-family:'Lora',serif;font-size:1.05rem;color:#8a3a10;margin-bottom:8px;}
.substack-card p{font-size:0.87rem;color:#7a4020;margin-bottom:16px;line-height:1.65;}

/* ── FEEDBACK ── */
.feedback-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:13px;}
.feedback-card h3{font-family:'Lora',serif;font-size:0.96rem;color:var(--accent2);margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.stars-row{display:flex;gap:8px;justify-content:center;margin-bottom:13px;}
.star-btn{font-size:1.5rem;background:none;border:none;cursor:pointer;transition:transform 0.15s;padding:2px;}
.star-btn:hover,.star-btn.active{transform:scale(1.2);}
.star-btn.dimmed{opacity:0.3;}
.feedback-sent{background:var(--success-soft);border:1px solid #b8e0c8;border-radius:8px;padding:12px;text-align:center;font-size:0.86rem;color:var(--success);display:none;margin-top:10px;}

/* ── CONSENT ── */
.consent-card{background:linear-gradient(135deg,#f0f7ff,#e8f1ff);border:1.5px solid #b8d4e6;border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:13px;}
.consent-card h3{font-family:'Lora',serif;font-size:0.96rem;color:var(--accent);margin-bottom:9px;}
.consent-card p{font-size:0.82rem;color:var(--text-light);margin-bottom:13px;line-height:1.6;}
.consent-toggle{display:flex;align-items:center;gap:12px;padding:11px 13px;background:white;border:1.5px solid var(--border);border-radius:9px;cursor:pointer;transition:all 0.15s;margin-bottom:7px;}
.consent-toggle:hover{border-color:var(--accent);background:var(--accent-soft);}
.toggle-switch{width:40px;height:22px;background:var(--border);border-radius:99px;position:relative;flex-shrink:0;transition:background 0.2s;}
.toggle-switch.on{background:var(--accent);}
.toggle-knob{width:16px;height:16px;background:white;border-radius:50%;position:absolute;top:3px;left:3px;transition:left 0.2s;box-shadow:0 1px 4px rgba(0,0,0,0.15);}
.toggle-switch.on .toggle-knob{left:21px;}
.toggle-label{font-size:0.86rem;color:var(--text);line-height:1.4;}

/* ── CONTACTS ── */
.contacts-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin-bottom:13px;}
.contacts-card h3{font-family:'Lora',serif;font-size:0.96rem;color:var(--accent2);margin-bottom:9px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.contacts-card p{font-size:0.82rem;color:var(--text-light);margin-bottom:13px;line-height:1.6;}
.contact-field{margin-bottom:9px;}
.contact-field label{display:block;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-light);font-weight:500;margin-bottom:4px;}
.contact-sent{background:var(--success-soft);border:1px solid #b8e0c8;border-radius:8px;padding:12px;text-align:center;font-size:0.85rem;color:var(--success);display:none;margin-top:10px;}

/* ── DONATION ── */
.donation-card{background:linear-gradient(135deg,#fffbf0,#fff8e8);border:1.5px solid #f0d9a0;border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow);margin-bottom:13px;text-align:center;}
.donation-card h3{font-family:'Lora',serif;font-size:1.05rem;color:#8a6020;margin-bottom:7px;}
.donation-intro{font-size:0.86rem;color:#7a6030;margin-bottom:6px;line-height:1.65;}
.donation-cta{font-size:0.86rem;color:#6a4a10;font-weight:500;margin-bottom:15px;line-height:1.55;background:#fff3d6;border-radius:8px;padding:10px 14px;border:1px solid #f0d9a0;}
.donation-amounts{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-bottom:15px;}
.donation-pill{padding:7px 15px;border:1.5px solid #d4a840;border-radius:99px;background:white;color:#8a6020;font-weight:500;font-size:0.87rem;cursor:pointer;transition:all 0.2s;font-family:'DM Sans',sans-serif;}
.donation-pill:hover,.donation-pill.selected{background:var(--warm);color:white;border-color:var(--warm);}
.payment-methods{display:flex;flex-direction:column;gap:8px;}
.pay-method-btn{width:100%;justify-content:center;padding:12px;}
.pay-divider{display:flex;align-items:center;gap:10px;margin:2px 0;}
.pay-divider::before,.pay-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.pay-divider span{font-size:0.73rem;color:var(--text-light);}
.donation-note{font-size:0.75rem;color:#9a8050;margin-top:11px;line-height:1.5;}
.crypto-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:200;align-items:center;justify-content:center;padding:20px;}
.crypto-modal.open{display:flex;}
.crypto-box{background:var(--surface);border-radius:var(--radius);padding:26px;max-width:420px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,0.2);}
.crypto-box h4{font-family:'Lora',serif;font-size:1rem;color:var(--text);margin-bottom:14px;}
.crypto-entry{margin-bottom:12px;}
.crypto-entry label{font-size:0.75rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-light);font-weight:500;display:block;margin-bottom:4px;}
.crypto-addr{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:8px 11px;font-family:monospace;font-size:0.75rem;word-break:break-all;color:var(--text);display:flex;justify-content:space-between;align-items:center;gap:8px;}
.copy-addr-btn{border:none;background:none;cursor:pointer;color:var(--accent);font-size:0.78rem;font-weight:500;font-family:'DM Sans',sans-serif;white-space:nowrap;}

@media(max-width:520px){.q-card,.summary-card,.donation-card,.feedback-card,.consent-card,.contacts-card,.substack-card,.followup-card{padding:15px;}.welcome-card{padding:20px 14px;}.btn{padding:10px 11px;font-size:0.83rem;}}
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="logo-main">Post Acute Infectious Sequelae</div>
    <div class="logo-sub">BuonsensoClinic · Patient Assessment</div>
  </div>
  <div class="lang-toggle">
    <button class="lang-btn active" onclick="setLang('it')" id="btn-it">🇮🇹</button>
    <button class="lang-btn" onclick="setLang('en')" id="btn-en">🇬🇧</button>
    <button class="lang-btn" onclick="setLang('fr')" id="btn-fr">🇫🇷</button>
    <button class="lang-btn" onclick="setLang('es')" id="btn-es">🇪🇸</button>
  </div>
</header>

<div class="progress-wrap" id="progress-wrap" style="display:none">

// ╚══════════════════════════════════════════════════╝
function generateCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let code='';
  for(let i=0;i<8;i++){
    if(i===4)code+='-';
    code+=chars[Math.floor(Math.random()*chars.length)];
  }
  return code;
}

function saveToLocalStorage(code, data){
  try{localStorage.setItem('pais_'+code, JSON.stringify(data));}catch(e){console.warn('localStorage not available');}
}
function loadFromLocalStorage(code){
  try{const d=localStorage.getItem('pais_'+code);return d?JSON.parse(d):null;}catch(e){return null;}
}

// ║  SESSION EXPORT / IMPORT                         ║
// ╚══════════════════════════════════════════════════╝
function buildSessionData(){
  return {
    version:2,
    code:patientCode,
    visitNumber,
    visitDate,
    lang,
    answers:JSON.parse(JSON.stringify(answers)),
    history: prevAnswers ? [{visitNumber: visitNumber-1, date: prevAnswers._visitDate||'', answers: prevAnswers}] : [],
  };
}

function exportSession(){
  const data=buildSessionData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const patName=(answers.name_age||'patient').replace(/[^a-zA-Z0-9]/g,'-').substring(0,15);
  a.download=`PAIS-${patName}-${patientCode}-V${visitNumber}.json`;
  a.click();
}

function loadFromFile(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(!data.code||!data.answers)throw new Error('Invalid file');
      initFollowupFromData(data);
    }catch(err){
      document.getElementById('fu-code-error').textContent=lang==='it'?'File non valido.':'Invalid file.';
      document.getElementById('fu-code-error').style.display='block';
    }
  };
  reader.readAsText(file);
}

function loadByCode(){
  const code=document.getElementById('fu-code-input').value.trim().toUpperCase();
  const data=loadFromLocalStorage(code);
  if(!data){
    document.getElementById('fu-code-error').textContent=t('fu_code_error');
    document.getElementById('fu-code-error').style.display='block';
    return;
  }
  initFollowupFromData(data);
}

function initFollowupFromData(data){
  patientCode=data.code;
  visitNumber=(data.visitNumber||1)+1;
  visitDate=new Date().toLocaleDateString(lang==='it'?'it-IT':lang==='fr'?'fr-FR':lang==='es'?'es-ES':'en-GB');
  prevAnswers={...data.answers, _visitDate: data.visitDate||''};
  answers=JSON.parse(JSON.stringify(data.answers)); // pre-fill
  isFollowup=true;
  currentStep=0;
  document.getElementById('progress-wrap').style.display='block';
  document.getElementById('followup-banner').style.display='block';
  document.getElementById('fu-banner-text').textContent=t('fu_banner_text');
  document.getElementById('fu-summary-badge').style.display='block';
  document.getElementById('fu-summary-label').textContent=t('fu_summary_label');
  showScreen('screen-questions');
  renderQuestion();
}

function goNext(){saveCurrentAnswer();if(currentStep<questions.length-1){currentStep++;renderQuestion();}else generateSummary();}

function updateProgress(){
  const pct=Math.round((currentStep/questions.length)*100);
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-pct').textContent=pct+'%';
  const secs=[...new Set(questions.map(q=>q.section[lang]))];
  document.getElementById('progress-label').textContent=T[lang].progress(secs.indexOf(questions[currentStep].section[lang])+1,secs.length);
}

// ║  RENDER QUESTION                                 ║
// ╚══════════════════════════════════════════════════╝
function hasChanged(key){
  if(!prevAnswers||prevAnswers[key]===undefined)return false;
  const prev=JSON.stringify(prevAnswers[key]);
  const curr=JSON.stringify(answers[key]);
  return prev!==curr;
}
function prevDisplay(key){
  if(!prevAnswers||prevAnswers[key]===undefined)return '';
  const v=prevAnswers[key];
  if(Array.isArray(v))return v.join(', ')||'—';
  if(typeof v==='object'&&v!==null)return `${v.slider||'?'}/10 — ${v.text||''}`;
  return String(v||'—');
}

function renderQuestion(){
  const q=questions[currentStep];updateProgress();
  document.getElementById('q-section').textContent=q.section[lang];
  document.getElementById('q-text').textContent=q.q[lang];
  document.getElementById('q-hint').textContent=q.hint[lang];
  const hasVoice=['text','textarea','slider_text'].includes(q.type);
  document.getElementById('voice-wrap').style.display=hasVoice?'flex':'none';
  if(isRecording)toggleVoice();
  document.getElementById('voice-btn-text').textContent=t('voice_use');
  document.getElementById('voice-status').textContent='';
  const area=document.getElementById('q-input-area');
  const saved=answers[q.key];
  const changed=hasChanged(q.key);

  if(q.type==='text'){area.innerHTML=`<input type="text" id="q-input" value="${saved||''}" ${changed?'style="border-color:var(--changed);background:var(--changed-soft)"':''}>` + (changed?`<span class="changed-indicator">✏️ ${t('changed_label')}</span>`:'' );}
  else if(q.type==='textarea'){area.innerHTML=`<textarea id="q-input" ${changed?'style="border-color:var(--changed);background:var(--changed-soft)"':''}>${saved||''}</textarea>`;}
  else if(q.type==='slider_text'){
    const v=saved?.slider??5;
    area.innerHTML=`<div style="padding:2px 0"><input type="range" id="q-slider" min="0" max="10" value="${v}" oninput="document.getElementById('sv').textContent=this.value"><div class="slider-value" id="sv">${v}</div><div class="slider-labels"><span>0</span><span>5</span><span>10</span></div></div><textarea id="q-input" placeholder="${t('describe')}" style="margin-top:11px${changed?';border-color:var(--changed);background:var(--changed-soft)':''}">${saved?.text||''}</textarea>`;
  }
  else if(q.type==='multicheck'){const opts=q.options[lang];const sel=saved||[];area.innerHTML=`<div class="options-grid">${opts.map(o=>`<label class="option-label ${sel.includes(o)?'selected':''}" onclick="toggleCheck(this,'${q.key}')"><div class="option-dot"></div><span>${o}</span></label>`).join('')}</div>`;}
  else if(q.type==='adl'){const opts=ADL[lang];const sel=saved||[];area.innerHTML=`<p class="adl-note">${t('adl_note')}</p><div class="options-grid">${opts.map(o=>`<label class="option-label ${sel.includes(o)?'selected':''}" onclick="toggleCheck(this,'${q.key}')"><div class="option-dot"></div><span>${o}</span></label>`).join('')}</div>`;}
  else if(q.type==='bell'){const scale=bellScale[lang];const ss=saved||null;area.innerHTML=`<p style="font-size:0.78rem;color:var(--text-light);margin-bottom:8px">${t('bell_label')}</p><div class="bell-card"><strong>Bell Disability Scale</strong>${scale.map(item=>`<div class="bell-row ${ss==item.score?'bell-selected':''}" onclick="selectBell(${item.score},'${q.key}',this)"><span class="bell-score">${item.score}</span><span class="bell-desc">${item.desc}</span></div>`).join('')}</div>`;}

  // Previous value hint for follow-up
  const pvArea=document.getElementById('prev-value-area');
  if(isFollowup&&prevAnswers&&prevAnswers[q.key]!==undefined){
    pvArea.innerHTML=`<div class="prev-value">📌 ${t('prev_label')}: <em>${prevDisplay(q.key)}</em></div>`;
  } else {pvArea.innerHTML='';}

  document.getElementById('upload-section').style.display=q.showUpload?'block':'none';
  if(q.showUpload)renderFileList();
  document.getElementById('next-text').textContent=currentStep===questions.length-1?t('finish'):t('next');
  document.getElementById('back-text').textContent=t('back');

// ── Read uploaded files and convert to base64 ──────────────────────
async function readUploadedFiles(){
  const results = [];
  for(const file of uploadedFiles){
    try{
      const base64 = await fileToBase64(file);
      const isPDF = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
      const isImage = file.type.startsWith('image/');
      const isText = file.type.startsWith('text/') || file.name.toLowerCase().endsWith('.txt');
      results.push({ name: file.name, type: file.type, base64, isPDF, isImage, isText, size: file.size });
    }catch(e){
      results.push({ name: file.name, error: true });
    }
  }
  return results;
}

function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const b64 = reader.result.split(',')[1];
      resolve(b64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── Build messages array with files + text ─────────────────────────
async function buildMessages(fileContents){
  const userContent = [];

  // Add each readable file as a content block
  for(const fc of fileContents){
    if(fc.error) continue;
    if(fc.isPDF){
      userContent.push({
        type: 'document',
        source: { type: 'base64', media_type: 'application/pdf', data: fc.base64 }
      });
      userContent.push({ type: 'text', text: `[Documento allegato: ${fc.name}]` });
    } else if(fc.isImage){
      const mtype = fc.type.includes('png') ? 'image/png' : fc.type.includes('jpg')||fc.type.includes('jpeg') ? 'image/jpeg' : 'image/png';
      userContent.push({
        type: 'image',
        source: { type: 'base64', media_type: mtype, data: fc.base64 }
      });
      userContent.push({ type: 'text', text: `[Immagine allegata: ${fc.name}]` });
    } else if(fc.isText){
      // Decode text file
      try {
        const txt = atob(fc.base64);
        userContent.push({ type: 'text', text: `[File di testo allegato: ${fc.name}]\n${txt.substring(0,3000)}` });
      } catch(e) {
        userContent.push({ type: 'text', text: `[File allegato: ${fc.name} — impossibile leggere]` });
      }
    }
  }

  // Add the main prompt
  userContent.push({ type: 'text', text: buildPrompt(fileContents) });

  return [{ role: 'user', content: userContent }];
}

function buildChangesBlock(){
  if(!prevAnswers)return '';

  for(const q of questions){
    const key=q.key;

async function downloadPDF(){trackEvent('pdf_downloaded',{visit:visitNumber});
  const summaryText=document.getElementById('summary-output').value;
  if(!summaryText||summaryText.startsWith('⏳')){alert(lang==='it'?'Attendi la generazione del sunto.':'Please wait for the summary.');return;}
  document.getElementById('pdf-generating').style.display='flex';
  document.getElementById('pdf-btn').disabled=true;
  await new Promise(r=>setTimeout(r,100));
  try{
    const {jsPDF}=window.jspdf;const doc=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
    const pageW=210,pageH=297,mL=18,mR=18,mT=20,mB=25,tW=pageW-mL-mR;
    let y=mT;
    const isfu=isFollowup;

    function checkPage(n=8){if(y+n>pageH-mB){doc.addPage();y=mT;addHeader();}}
    function addHeader(){
      doc.setFillColor(isfu?180:74,isfu?120:122,isfu?20:155);
      doc.rect(0,0,pageW,12,'F');
      doc.setTextColor(255,255,255);doc.setFontSize(7.5);doc.setFont('helvetica','bold');
      const htxt=isfu?`POST ACUTE INFECTIOUS SEQUELAE  |  BuonsensoClinic  |  ${t('followup_label').toUpperCase()} V${visitNumber}`:'POST ACUTE INFECTIOUS SEQUELAE  |  BuonsensoClinic';
      doc.text(htxt,mL,8);
      doc.setFont('helvetica','normal');doc.text(`${patientCode} · ${visitDate}`,pageW-mR,8,{align:'right'});
      doc.setTextColor(40,35,32);
    }
    addHeader();y=20;

    // Title
    doc.setFillColor(isfu?255:240,isfu?248:246,isfu?230:250);
    doc.setDrawColor(isfu?200:180,isfu?160:210,isfu?60:230);
    doc.roundedRect(mL,y,tW,24,3,3,'FD');
    doc.setTextColor(isfu?120:74,isfu?80:122,isfu?20:155);
    doc.setFontSize(12);doc.setFont('helvetica','bold');
    doc.text('Post Acute Infectious Sequelae',mL+5,y+8);
    doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(100,90,80);
    doc.text(`BuonsensoClinic  ·  ${isfu?t('followup_label')+' '+visitNumber:t('visit_label')+' '+visitNumber}  ·  ${visitDate}`,mL+5,y+15);
    doc.setFontSize(7.5);doc.setTextColor(130,115,100);
    doc.text(`${lang==='it'?'Codice paziente':lang==='fr'?'Code patient':lang==='es'?'Código paciente':'Patient code'}: ${patientCode}`,mL+5,y+21);
    y+=30;

    // Content
    const lines=summaryText.split('\n');
    for(const line of lines){
      checkPage(7);const trimmed=line.trim();
      if(trimmed.startsWith('━━')){
        y+=3;checkPage(10);
        const secTitle=trimmed.replace(/━━/g,'').trim();
        const isChange=secTitle.includes('VARIA')||secTitle.includes('CHANGE')||secTitle.includes('CHANGEMENT')||secTitle.includes('CAMBIO');
        doc.setFillColor(isChange?255:230,isChange?248:240,isChange?220:246);
        doc.rect(mL,y-4,tW,8,'F');
        doc.setFontSize(7.5);doc.setFont('helvetica','bold');
        doc.setTextColor(isChange?160:74,isChange?100:122,isChange?20:155);
        doc.text(secTitle,mL+5,y+0.5);doc.setTextColor(40,35,32);y+=7;
      } else if(trimmed.startsWith('•')){
        checkPage(6);doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(40,35,32);
        const content=trimmed.substring(1).trim();const wrapped=doc.splitTextToSize(content,tW-8);
        doc.text('•',mL+2,y);doc.text(wrapped,mL+7,y);y+=wrapped.length*5+1;
      } else if(trimmed.startsWith('  ')||trimmed.startsWith('→')){
        checkPage(5);doc.setFontSize(8);doc.setFont('helvetica','italic');doc.setTextColor(100,90,80);
        const wrapped=doc.splitTextToSize(trimmed,tW-12);doc.text(wrapped,mL+10,y);y+=wrapped.length*4.5+1;
        doc.setFont('helvetica','normal');doc.setTextColor(40,35,32);
      } else if(trimmed.length>0){
        checkPage(6);doc.setFontSize(8.5);doc.setFont('helvetica','normal');doc.setTextColor(40,35,32);
        const wrapped=doc.splitTextToSize(trimmed,tW);doc.text(wrapped,mL,y);y+=wrapped.length*5+1;
      } else {y+=3;}
    }

    // Contacts
    const cn=document.getElementById('contact-name')?.value;const ce=document.getElementById('contact-email')?.value;const cp=document.getElementById('contact-phone')?.value;const cno=document.getElementById('contact-note')?.value;
    if(cn||ce||cp){
      checkPage(28);y+=4;
      const L2=(it,en,fr,es)=>lang==='it'?it:lang==='fr'?fr:lang==='es'?es:en;
      doc.setFillColor(230,240,246);doc.rect(mL,y-4,tW,8,'F');
      doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(74,122,155);
      doc.text(L2('CONTATTI PAZIENTE','PATIENT CONTACTS','CONTACTS PATIENT','CONTACTOS PACIENTE'),mL+5,y+0.5);
      doc.setTextColor(40,35,32);y+=7;doc.setFontSize(8.5);doc.setFont('helvetica','normal');
      if(cn){doc.text(`• ${L2('Nome','Name','Nom','Nombre')}: ${cn}`,mL+5,y);y+=5;}
      if(ce){doc.text(`• Email: ${ce}`,mL+5,y);y+=5;}
      if(cp){doc.text(`• Tel/WhatsApp: ${cp}`,mL+5,y);y+=5;}
      if(cno){const wnote=doc.splitTextToSize(`• ${L2('Note','Notes','Notes','Notas')}: ${cno}`,tW-8);doc.text(wnote,mL+5,y);y+=wnote.length*5;}
    }

    // Consent
    checkPage(14);y+=4;
    doc.setFillColor(240,246,255);doc.rect(mL,y,tW,12,'F');
    doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(74,122,155);
    doc.text(lang==='it'?'CONSENSO RICERCA':lang==='fr'?'CONSENTEMENT RECHERCHE':lang==='es'?'CONSENTIMIENTO':'RESEARCH CONSENT',mL+4,y+5);
    doc.setFont('helvetica','normal');doc.setTextColor(60,80,100);doc.setFontSize(8);
    doc.text(`${lang==='it'?'Dati anonimi':lang==='fr'?'Données anonymes':lang==='es'?'Datos anónimos':'Anonymous data'}: ${consentData?'✓ YES':'✗ NO'}   |   ${lang==='it'?'Contatto studi':lang==='fr'?'Contact études':lang==='es'?'Contacto estudios':'Contact for studies'}: ${consentContact?'✓ YES':'✗ NO'}`,mL+4,y+10);
    y+=16;

    // Disclaimer
    checkPage(30);y+=4;
    doc.setFillColor(255,248,235);doc.setDrawColor(200,160,80);doc.roundedRect(mL,y,tW,26,3,3,'FD');
    doc.setFontSize(7.5);doc.setFont('helvetica','bold');doc.setTextColor(120,80,20);
    doc.text(lang==='it'?'NOTA CLINICA':lang==='fr'?'NOTE CLINIQUE':lang==='es'?'NOTA CLÍNICA':'CLINICAL NOTE',mL+4,y+6);
    doc.setFont('helvetica','normal');doc.setTextColor(80,60,20);
    const dlines=doc.splitTextToSize(t('pdf_disclaimer'),tW-8);doc.text(dlines,mL+4,y+12);
    y+=30;

    // Substack CTA
    checkPage(16);y+=3;
    doc.setFillColor(255,240,228);doc.setDrawColor(220,100,25);doc.roundedRect(mL,y,tW,14,3,3,'FD');
    doc.setFontSize(8);doc.setFont('helvetica','bold');doc.setTextColor(160,60,10);
    doc.text('📰  Buonsenso & the Kids',mL+4,y+5.5);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(100,50,10);
    const ctaLines=doc.splitTextToSize(t('pdf_contact_cta'),tW-8);doc.text(ctaLines,mL+4,y+10);
    y+=18;

    // Footer pages
    const totalPages=doc.getNumberOfPages();
    for(let i=1;i<=totalPages;i++){
      doc.setPage(i);doc.setFontSize(7);doc.setFont('helvetica','normal');doc.setTextColor(160,150,140);
      doc.text(`BuonsensoClinic · PAIS · ${patientCode} · ${visitDate}`,mL,pageH-8);
      doc.text(`${i} / ${totalPages}`,pageW-mR,pageH-8,{align:'right'});
    }

    const patName=(answers.name_age||'patient').replace(/[^a-zA-Z0-9]/g,'-').substring(0,15);
    doc.save(`PAIS-${patName}-${patientCode}-V${visitNumber}-${new Date().toISOString().slice(0,10)}.pdf`);
  }catch(err){console.error(err);alert(lang==='it'?'Errore PDF. Usa "Copia testo".':'PDF error. Use "Copy text".');}
  document.getElementById('pdf-generating').style.display='none';
  document.getElementById('pdf-btn').disabled=false;
}

// ╔══════════════════════════════════════════════════╗
// ║  COPY / EMAIL                                    ║
// ╚══════════════════════════════════════════════════╝
function copyPatientCode(){
  navigator.clipboard.writeText(patientCode).then(()=>{
    const msg=document.getElementById('code-copied-msg');
    msg.textContent=t('code_copied_msg');
    msg.style.display='block';
    setTimeout(()=>msg.style.display='none',2500);
  });
}
function copySummary(){navigator.clipboard.writeText(document.getElementById('summary-output').value).then(()=>{const el=document.getElementById('copy-success');el.textContent=t('copied');el.style.display='block';setTimeout(()=>el.style.display='none',2500);});}
function emailSummary(){const text=encodeURIComponent(document.getElementById('summary-output').value+'\n\n'+t('pdf_disclaimer')+'\n\n'+t('pdf_contact_cta'));window.location.href=`mailto:?subject=${encodeURIComponent(t('summary_subject'))}&body=${text}`;}

// ╔══════════════════════════════════════════════════╗
// ║  FEEDBACK / CONSENT / CONTACTS / DONATION        ║
// ╚══════════════════════════════════════════════════╝
function rateStar(n){starRating=n;for(let i=1;i<=5;i++){const s=document.getElementById('s'+i);s.classList.toggle('active',i<=n);s.classList.toggle('dimmed',i>n);}document.getElementById('feedback-form').style.display='block';}
function sendFeedback(){const txt=document.getElementById('feedback-text').value;document.getElementById('summary-output').value+=`\n\n[FEEDBACK: ${starRating}/5 — ${txt||''}]`;document.getElementById('feedback-form').style.display='none';document.getElementById('feedback-sent').textContent=t('feedback_thanks');document.getElementById('feedback-sent').style.display='block';}
function toggleConsent(type){if(type==='data'){consentData=!consentData;document.getElementById('sw-data').classList.toggle('on',consentData);}else{consentContact=!consentContact;document.getElementById('sw-contact').classList.toggle('on',consentContact);}}
function saveContacts(){const ce=document.getElementById('contact-email').value;const cp=document.getElementById('contact-phone').value;if(!ce&&!cp){document.getElementById('contact-email').focus();return;}document.getElementById('contact-sent').textContent=t('contacts_saved');document.getElementById('contact-sent').style.display='block';}
function donate(amount,id){document.querySelectorAll('.donation-pill').forEach(p=>p.classList.remove('selected'));selectedDonation=amount;document.getElementById(id).classList.add('selected');document.getElementById('donation-action').style.display='block';}
function openRevolut(){trackEvent('donation_click',{method:'revolut',amount:selectedDonation});window.open(selectedDonation>0?`${PAY.revolut}/${selectedDonation}`:PAY.revolut,'_blank');}
function openPaypal(){trackEvent('donation_click',{method:'paypal',amount:selectedDonation});window.open(selectedDonation>0?`${PAY.paypal}/${selectedDonation}EUR`:PAY.paypal,'_blank');}
function openCrypto(){trackEvent('donation_click',{method:'crypto'});document.getElementById('crypto-modal').classList.add('open');}
function closeCryptoIfBg(e){if(e.target===document.getElementById('crypto-modal'))document.getElementById('crypto-modal').classList.remove('open');}
function copyAddr(addrId,btnId){navigator.clipboard.writeText(document.getElementById(addrId).textContent).then(()=>{const b=document.getElementById(btnId);b.textContent='✓';setTimeout(()=>b.textContent=t('copy_addr'),2000);});}

// ╔══════════════════════════════════════════════════╗
// ║  INIT                                            ║
// ╚══════════════════════════════════════════════════╝
applyStaticTranslations();
</script>
